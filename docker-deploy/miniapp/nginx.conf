server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    location /api/bot/ { proxy_pass http://bot:5000; proxy_set_header Host $host; proxy_read_timeout 300s; }
    location /uploads/ { proxy_pass http://bot:5000; proxy_set_header Host $host; }
    location /webhook  { proxy_pass http://bot:5000; proxy_set_header Host $host; }

    location /api/text/ {
        proxy_pass https://v3258578.hosted-by-vdsina.ru;
        proxy_set_header Host v3258578.hosted-by-vdsina.ru;
        proxy_ssl_server_name on; proxy_read_timeout 60s;
    }
    location /api/vision/ {
        proxy_pass https://v3258578.hosted-by-vdsina.ru;
        proxy_set_header Host v3258578.hosted-by-vdsina.ru;
        proxy_ssl_server_name on; proxy_read_timeout 60s;
    }
    location = /api/health {
        proxy_pass https://v3258578.hosted-by-vdsina.ru;
        proxy_set_header Host v3258578.hosted-by-vdsina.ru;
        proxy_ssl_server_name on;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
