<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Аварийный диспетчер МКД — MAX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
/* Inline styles to ensure theme color takes effect immediately and avoid flickering */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
html.light, html.light body { background-color: #ffffff !important; color: #000000; }
html.dark, html.dark body { background-color: #1a1a1a !important; color: #ffffff; }
</style>
<script>
// Set theme immediately before React loads to avoid flickering
(function () {
const isInIframe = window.self !== window.top;
function applyThemeToDOM(theme) {
document.documentElement.classList.remove("light", "dark");
document.documentElement.classList.add(theme);
document.documentElement.setAttribute("data-theme", theme);
}
if (isInIframe) {
window.addEventListener("message", function (event) {
if (event.data && typeof event.data.theme === "string") {
if (event.data.theme === "light" || event.data.theme === "dark") {
applyThemeToDOM(event.data.theme);
}
}
});
} else { applyThemeToDOM("light"); }
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
